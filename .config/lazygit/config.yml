gui:
  nerdFontsVersion: "3"
  showFileIcons: true
  border: rounded
  scrollHeight: 2
  scrollPastBottom: true
  mouseEvents: true
  sidePanelWidth: 0.333
  expandFocusedSidePanel: true
  mainPanelSplitMode: flexible
  enlargedSideViewLocation: top
  showRandomTip: false
  showCommandLog: false
  showBottomLine: true
  showPanelJumps: true
  showListFooter: true
  showFileTree: true
  theme:
    activeBorderColor:
      - "#d79921"
      - bold
    inactiveBorderColor:
      - "#665c54"
    optionsTextColor:
      - "#d79921"
    selectedLineBgColor:
      - "#3c3836"
    cherryPickedCommitBgColor:
      - "#504945"
    cherryPickedCommitFgColor:
      - "#b8bb26"
    unstagedChangesColor:
      - "#fb4934"
    defaultFgColor:
      - "#ebdbb2"
    searchingActiveBorderColor:
      - "#fe8019"
      - bold
    authorColors:
      "*": "#83a598"
    branchColorPatterns:
      "^main$": "#b8bb26"
      "^master$": "#b8bb26"
      "^develop$": "#8ec07c"
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never
  commit:
    signOff: false
    autoWrapCommitMessage: true
    autoWrapWidth: 72
  merging:
    manualCommit: false
    args: ""
  log:
    order: topo-order
    showGraph: always
    showWholeGraph: false
  branchLogCmd: ""
  autoFetch: true
  autoRefresh: true
  fetchAll: true
  parseEmoji: true
  allBranchesLogCmds: []
os:
  editPreset: "nvim"
  edit: "nvim {{filename}}"
  editAtLine: "nvim +{{line}} {{filename}}"
  openDirInEditor: "nvim {{dir}}"
  openLink: "xdg-open {{link}}"
keybinding:
  universal:
    quit: q
    return: <esc>
    prevItem: k
    nextItem: j
    prevBlock: h
    nextBlock: l
    scrollUpMain: <c-u>
    scrollDownMain: <c-d>
    gotoTop: <home>
    gotoBottom: <end>
customCommands: []
